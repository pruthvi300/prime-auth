services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime_secret
      POSTGRES_DB: prime_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prime -d prime_auth"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://prime:prime_secret@postgres:5432/prime_auth
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
