name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests alembic

      - name: Test
        run: pytest --cov=app --cov-report=term-missing

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prime
          POSTGRES_PASSWORD: prime_secret
          POSTGRES_DB: prime_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prime" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://prime:prime_secret@localhost:5432/prime_auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Upgrade, check for drift, downgrade
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
